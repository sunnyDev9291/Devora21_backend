<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Devora21 Capture Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Capture settings</h1>
      <p class="lede">
        Connect the extension to your Devora21 account. Screenshots upload only after you
        review them in the side panel.
      </p>

      <label class="consent">
        <input id="consentAccepted" type="checkbox" />
        I consent to capturing application page screenshots and storing them in Devora21.
      </label>

      <label>
        API base URL
        <input id="apiBaseUrl" type="url" placeholder="https://api.example.com" />
      </label>

      <label>
        API key
        <input id="apiKey" type="password" autocomplete="off" placeholder="dv21_…" />
      </label>

      <label>
        Optional host allowlist (one per line, blank = all sites)
        <textarea id="allowedHosts" rows="4" placeholder="jobs.ashbyhq.com"></textarea>
      </label>

      <section class="submit-texts" aria-labelledby="submitTextsHeading">
        <h2 id="submitTextsHeading">Submit button texts</h2>
        <p class="hint">
          Exact match (case-insensitive) against button text, value, aria-label, or title.
          Add labels like <code>Submit application</code> or <code>Apply Now</code> as needed.
        </p>
        <ul id="submitTextsList" class="submit-texts-list"></ul>
        <div class="submit-texts-add">
          <input
            id="submitTextNew"
            type="text"
            maxlength="120"
            placeholder="New label, e.g. Send Application"
            autocomplete="off"
          />
          <button id="submitTextAdd" type="button" class="secondary">Add</button>
        </div>
      </section>

      <label class="consent">
        <input id="captureEnabled" type="checkbox" />
        Enable capture by default
      </label>

      <div class="row">
        <button id="save" type="button">Save</button>
        <button id="test" type="button" class="secondary">Test connection</button>
      </div>
      <p id="message" class="message" hidden></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
