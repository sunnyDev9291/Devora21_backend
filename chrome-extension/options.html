<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Devora21 Apply Gate Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Apply gate settings</h1>
      <p class="lede">
        Connect to Devora21. When the gate is On, Submit / Apply / Send asks for
        a screenshot before the site action continues.
      </p>

      <label class="consent">
        <input id="consentAccepted" type="checkbox" />
        I consent to uploading apply screenshots to Devora21 for review.
      </label>

      <label>
        API base URL
        <input id="apiBaseUrl" type="url" placeholder="https://api.example.com" />
      </label>

      <label>
        API key
        <input id="apiKey" type="password" autocomplete="off" placeholder="dv21_…" />
      </label>

      <label class="consent">
        <input id="applyGateEnabled" type="checkbox" />
        Require screenshot before Submit / Apply / Send
      </label>

      <div class="row">
        <button id="save" type="button">Save</button>
        <button id="test" type="button" class="secondary">Test connection</button>
      </div>
      <p id="message" class="message" hidden></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
