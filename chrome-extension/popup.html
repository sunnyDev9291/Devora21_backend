<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Devora21 Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <div>
          <p class="brand">Devora21</p>
          <h1>Capture</h1>
        </div>
        <button id="btnToggle" type="button" class="toggle off">Off</button>
      </header>
      <p id="statusLine" class="status">Turn capture on to begin</p>
      <div class="stat">
        <span>Submit detected</span>
        <strong id="submitDetected">—</strong>
      </div>
      <p class="hint">Submit click: scroll-capture → upload → native submit. Side panel shows the buffer.</p>
      <a id="openOptions" href="#">Settings</a>
      <pre id="error" class="error" hidden></pre>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
