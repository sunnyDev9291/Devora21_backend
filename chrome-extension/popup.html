<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Devora21 Apply Gate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <div>
          <p class="brand">Devora21</p>
          <h1>Apply gate</h1>
        </div>
        <button id="btnToggle" type="button" class="toggle off">Off</button>
      </header>

      <section id="recPanel" class="rec-panel phase-off" aria-live="polite">
        <div class="rec-row">
          <span id="recDot" class="rec-dot" aria-hidden="true"></span>
          <strong id="recLabel">Screenshot gate off</strong>
        </div>
        <p id="statusLine" class="status">
          When On, Submit / Apply / Send asks for a screenshot before continuing.
        </p>
      </section>

      <p class="hint">
        rrweb recording removed. Screenshots go to Super Admin Application Captures.
      </p>
      <a id="openOptions" href="#">Settings</a>
      <pre id="error" class="error" hidden></pre>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
